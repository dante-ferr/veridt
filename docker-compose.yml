name: veridt

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veridt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridt_local}
      POSTGRES_DB: veridt
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_local}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_local}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/01-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridt -d veridt"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: veridt
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-veridt_local}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    environment:
      TZ: America/Sao_Paulo

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:-identity_local}@postgres:5432/veridt?schema=identity
      RABBIT_URL: amqp://veridt:${RABBITMQ_PASSWORD:-veridt_local}@rabbitmq:5672
      JWT_ISSUER: veridt-identity
      JWT_AUDIENCE: veridt
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-identity_service_local}
      TZ: America/Sao_Paulo
    volumes:
      - identity-secrets:/var/lib/veridt
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      DATABASE_URL: postgresql://notification:${NOTIFICATION_DB_PASSWORD:-notification_local}@postgres:5432/veridt?schema=notification
      RABBIT_URL: amqp://veridt:${RABBITMQ_PASSWORD:-veridt_local}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: Veridt <no-reply@localhost>
      PUBLIC_WEB_ORIGIN: http://localhost:5173
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridt-identity
      JWT_AUDIENCE: veridt
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD:-payments_local}@postgres:5432/veridt?schema=payments
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridt-identity
      JWT_AUDIENCE: veridt
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      IDENTITY_URL: http://identity:3000
      PAYMENTS_URL: http://payments:3000
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridt-identity
      JWT_AUDIENCE: veridt
      PORT: "8080"
      TZ: America/Sao_Paulo
    depends_on:
      identity:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  postgres-data:
  identity-secrets:
